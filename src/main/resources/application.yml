spring:
  application:
    name: iurifycase-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/iurify_case_db
    username: iurify_user
    password: iurify_secure_password_2026
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: TRACE
