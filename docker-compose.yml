services:
  postgres:
    image: postgres:15-alpine
    container_name: iurify_case_db
    environment:
      POSTGRES_USER: iurify_user
      POSTGRES_PASSWORD: iurify_secure_password_2026
      POSTGRES_DB: iurify_case_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iurify_user -d iurify_case_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
